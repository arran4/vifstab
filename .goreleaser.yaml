version: 2
project_name: vifstab
builds:
  - id: vifstab
    binary: vifstab
    main: ./cmd/vifstab
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    builds_info:
      owner: root
      group: root
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE
        info: {owner: root, group: root, mode: 0644, mtime: '{{ .CommitDate }}'}
      - src: README.md
        info: {owner: root, group: root, mode: 0644, mtime: '{{ .CommitDate }}'}
      - src: INSTALL.md
        info: {owner: root, group: root, mode: 0644, mtime: '{{ .CommitDate }}'}
      - src: THIRD_PARTY_NOTICES.md
        info: {owner: root, group: root, mode: 0644, mtime: '{{ .CommitDate }}'}

# A real prerelease is both a GitHub prerelease and a version-tagged OCI image.
release:
  prerelease: auto
dockers_v2:
  - id: vifstab
    ids: [vifstab]
    dockerfile: Dockerfile
    images: [ghcr.io/arran4/vifstab]
    tags:
      - '{{ if .IsSnapshot }}snapshot{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    extra_files: [LICENSE, THIRD_PARTY_NOTICES.md]
    labels:
      org.opencontainers.image.title: vifstab
      org.opencontainers.image.description: Linux fstab verification and formatting
      org.opencontainers.image.source: https://github.com/arran4/vifstab
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.licenses: BSD-3-Clause
