name: Validation or workflow bug
description: Report a non-sensitive bug with a synthetic reproducer.
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, real host identifiers or unreviewed captures.
        For vulnerabilities, follow SECURITY.md and arrange a private channel.
        Use a harmless fixture; do not edit a real /etc/fstab to reproduce a bug.
  - type: input
    id: revision
    attributes:
      label: Revision and toolchain
      description: Exact commit or version, Go version, and relevant Linux kernel version. Omit private host details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and synthetic reproducer
      description: Include minimal input, fixture/test command and steps. Do not include secrets in arguments or output.
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results
      description: Include findings, exit status and what evidence supports the expected behavior. Identify unknown observations.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed all included text and attachments and removed confidential data and credentials.
          required: true
